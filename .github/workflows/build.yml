name: build

on:
  push:
    branches: [main, ci/avr32-apptainer-fix]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: deinit nested libavr32
        run: git -C vendor/aleph submodule deinit -f libavr32

      - name: install host tools
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # *_desc_build compiles/runs on the host; avr32 toolchain is 32-bit
          sudo apt-get install -y build-essential libc6:i386 fuse2fs

      - name: install singularity
        run: |
          set -euo pipefail
          # https://github.com/sylabs/singularity/releases/tag/v4.5.0
          deb=singularity-ce_4.5.0-noble_amd64.deb
          curl -fsSL -o "$deb" \
            "https://github.com/sylabs/singularity/releases/download/v4.5.0/${deb}"
          sudo apt-get install -y "./${deb}"
          singularity --version

      - name: pull aleph-builder
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            singularity registry login -u '${{ github.actor }}' --password-stdin oras://ghcr.io
          singularity pull --force aleph-builder.sif \
            oras://ghcr.io/ngwese/aleph-builder:latest
          sudo install -m 755 aleph-builder.sif /usr/local/bin/aleph-builder

      - name: diagnose avr32 cc1 path
        run: |
          set -euo pipefail
          cc1_path="$(aleph-builder avr32-gcc -print-prog-name=cc1)"
          echo "avr32-gcc -print-prog-name=cc1 -> ${cc1_path}"

      - name: build all apps and modules
        run: |
          set -uo pipefail

          for var in GCC_EXEC_PREFIX COMPILER_PATH PATH GCC_ROOT; do
            if [ -n "${!var+x}" ]; then
              echo "${var}=${!var}"
            else
              echo "${var} is unset"
            fi
          done

          unset GCC_EXEC_PREFIX COMPILER_PATH GCC_ROOT

          failed=0
          for d in apps/*/ modules/*/ modules_block/*/; do
            [ -f "${d}Makefile" ] || continue
            echo "::group::build ${d%/}"
            (cd "$d" && aleph-builder make) || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
