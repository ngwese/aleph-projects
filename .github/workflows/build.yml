name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: deinit nested libavr32
        run: git -C vendor/aleph submodule deinit -f libavr32

      - name: install host build tools
        run: |
          set -euo pipefail
          # *_desc_build compiles and runs against the host toolchain
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: set up apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.0

      - name: pull aleph-builder
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login -u '${{ github.actor }}' --password-stdin oras://ghcr.io
          apptainer pull --force aleph-builder.sif \
            oras://ghcr.io/ngwese/aleph-builder:latest
          sudo install -d /usr/local/lib
          sudo install -m 755 aleph-builder.sif /usr/local/lib/aleph-builder.sif
          # --cleanenv drops host GCC_* vars that otherwise make avr32-gcc
          # look for cc1 on the host and fail with execvp ENOENT
          printf '%s\n' \
            '#!/bin/sh' \
            'exec apptainer run --cleanenv /usr/local/lib/aleph-builder.sif "$@"' \
            | sudo tee /usr/local/bin/aleph-builder >/dev/null
          sudo chmod 755 /usr/local/bin/aleph-builder

      - name: debug avr32 toolchain
        run: |
          set -uo pipefail
          echo "=== host 32-bit support ==="
          uname -a
          grep -E 'CONFIG_IA32|ia32' /boot/config-$(uname -r) 2>/dev/null | head || true
          ls /lib/ld-linux.so.2 /lib64/ld-linux-x86-64.so.2 2>&1 || true
          echo "=== print cc1 path ==="
          aleph-builder avr32-gcc -print-prog-name=cc1
          echo "=== ls cc1 ==="
          aleph-builder ls -la /opt/avr/libexec/gcc/avr32/4.4.7/cc1
          echo "=== file cc1 ==="
          aleph-builder file /opt/avr/libexec/gcc/avr32/4.4.7/cc1
          echo "=== exec cc1 directly ==="
          aleph-builder /opt/avr/libexec/gcc/avr32/4.4.7/cc1 -v </dev/null | head -20
          echo "cc1_exit:$?"
          echo "=== compile test ==="
          aleph-builder avr32-gcc -c -x c /dev/null -o /tmp/t.o -v
          echo "compile_exit:$?"

      - name: build all apps and modules
        run: |
          set -uo pipefail
          failed=0
          for d in apps/*/ modules/*/ modules_block/*/; do
            [ -f "${d}Makefile" ] || continue
            echo "::group::build ${d%/}"
            (cd "$d" && aleph-builder make) || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
