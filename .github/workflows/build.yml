name: build

on:
  push:
    branches: [main, ci/avr32-apptainer-fix]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: deinit nested libavr32
        run: git -C vendor/aleph submodule deinit -f libavr32

      - name: install host build tools
        run: |
          set -euo pipefail
          # *_desc_build compiles and runs against the host toolchain
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: set up apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.0

      - name: pull aleph-builder
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login -u '${{ github.actor }}' --password-stdin oras://ghcr.io
          apptainer pull --force aleph-builder.sif \
            oras://ghcr.io/ngwese/aleph-builder:latest
          sudo install -d /usr/local/lib
          sudo install -m 755 aleph-builder.sif /usr/local/lib/aleph-builder.sif
          # Under apptainer on GHA, avr32-gcc fails to locate libexec/cc1 unless
          # GCC_EXEC_PREFIX is set (print-prog-name otherwise returns bare "cc1").
          # --cleanenv avoids host toolchain vars interfering.
          printf '%s\n' '#!/bin/sh' \
            'exec apptainer run --cleanenv --env GCC_EXEC_PREFIX=/opt/avr/libexec/gcc/ /usr/local/lib/aleph-builder.sif "$@"' \
            | sudo tee /usr/local/bin/aleph-builder >/dev/null
          sudo chmod 755 /usr/local/bin/aleph-builder
          cat /usr/local/bin/aleph-builder
          # sanity-check: avr32-gcc must resolve cc1 to a real path
          cc1_path="$(aleph-builder avr32-gcc -print-prog-name=cc1)"
          echo "avr32 cc1 -> ${cc1_path}"
          case "${cc1_path}" in
            /*) ;;
            *)
              echo "avr32-gcc could not resolve cc1" >&2
              exit 1
              ;;
          esac

      - name: build all apps and modules
        run: |
          set -uo pipefail
          failed=0
          for d in apps/*/ modules/*/ modules_block/*/; do
            [ -f "${d}Makefile" ] || continue
            echo "::group::build ${d%/}"
            (cd "$d" && aleph-builder make) || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
