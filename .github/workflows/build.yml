name: build

on:
  push:
    branches: [main, ci/avr32-apptainer-fix]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: deinit nested libavr32
        run: git -C vendor/aleph submodule deinit -f libavr32

      - name: install host build tools
        run: |
          set -euo pipefail
          # *_desc_build compiles and runs against the host toolchain
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: set up apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.0

      - name: pull aleph-builder
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            apptainer registry login -u '${{ github.actor }}' --password-stdin oras://ghcr.io
          apptainer pull --force aleph-builder.sif \
            oras://ghcr.io/ngwese/aleph-builder:latest

          sif=/usr/local/lib/aleph-builder.sif
          wrap=/usr/local/lib/aleph-builder-wrap
          sudo install -d /usr/local/lib "$wrap"
          sudo install -m 755 aleph-builder.sif "$sif"

          # Under apptainer on GHA, avr32-gcc only finds libexec/cc1 when argv[0]
          # is an absolute path. Bind thin wrappers that exec the real tools by
          # absolute path and put them first on PATH inside the container.
          for dir in /opt/avr/bin /opt/bfin/bin; do
            while IFS= read -r tool; do
              [ -n "$tool" ] || continue
              printf '%s\n' '#!/bin/sh' "exec ${dir}/${tool} \"\$@\"" \
                | sudo tee "$wrap/$tool" >/dev/null
              sudo chmod 755 "$wrap/$tool"
            done < <(apptainer exec "$sif" ls -1 "$dir")
          done

          printf '%s\n' '#!/bin/sh' \
            "exec apptainer run --cleanenv --bind ${wrap}:/opt/toolwrap:ro --env PATH=/opt/toolwrap:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin ${sif} \"\$@\"" \
            | sudo tee /usr/local/bin/aleph-builder >/dev/null
          sudo chmod 755 /usr/local/bin/aleph-builder

          echo "wrapper:"
          cat /usr/local/bin/aleph-builder
          cc1_path="$(aleph-builder avr32-gcc -print-prog-name=cc1)"
          echo "avr32 cc1 -> ${cc1_path}"
          case "${cc1_path}" in
            /*) ;;
            *)
              echo "avr32-gcc could not resolve cc1" >&2
              aleph-builder avr32-gcc -print-search-dirs || true
              exit 1
              ;;
          esac

      - name: build all apps and modules
        run: |
          set -uo pipefail
          failed=0
          for d in apps/*/ modules/*/ modules_block/*/; do
            [ -f "${d}Makefile" ] || continue
            echo "::group::build ${d%/}"
            (cd "$d" && aleph-builder make) || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
